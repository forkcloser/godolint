# The hadolint source godolint is generated from, pinned by tag and digest
# (book/tooling.md, "Pinned artifacts beyond aqua"). `just generate` reads the
# entry back with `limen pins get hadolint url|sha256`, fetches the tarball
# into .build/ and regenerates internal/rules from it; `just lint` regenerates
# and fails on a diff, so the committed rules and tests always match the pin.
# Renovate proposes the bumps and `limen pins refresh` recomputes the digest.
pins:
  - name: hadolint
    renovate: github-tags hadolint/hadolint
    version: 8ae25c05945f030b1ad520f1802e4143e7d0055d
    url: https://github.com/hadolint/hadolint/archive/${version}.tar.gz
    verify: download
    digest:
      version: 8ae25c05945f030b1ad520f1802e4143e7d0055d
      sha256: 6bb6e61465895fe7f5642af5c4ea1537f71ac6bd5300b86b43c8591677be4abd
