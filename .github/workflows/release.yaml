# Seeded once by `limen fix`, then the project's own: limen never updates it.
# Realign it by hand when limen's canonical moves, and comment every project
# line so the next alignment keeps it.
#
# The workflow half of the release lane: `just do release vX.Y.Z` verifies
# the tree, creates the SIGNED tag and pushes it; that push runs
# `just do release --ci`, which builds, signs keyless and publishes (defined
# in .limen/just/release.just, not here). Pair with a ruleset restricting who
# can create v* tags: the tag push is the release button.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

# One run PER TAG, never cancelled: keyed by ref, not a constant — a constant
# group keeps only the newest pending run, so pushing several tags at once
# silently cancels the older releases. A re-push of the same tag serializes
# behind the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

# Explicit bash: windows defaults to PowerShell, and bash brings -eo pipefail.
defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # Publish the GitHub release and its assets.
      contents: write
      # Keyless signing: cosign exchanges the workflow's OIDC token for a
      # short-lived Fulcio certificate bound to this workflow@tag identity;
      # the attestation below is signed the same way.
      id-token: write
      # Store the build provenance attestations.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser walks the full history to find the previous tag, where
          # GitHub's generated notes start; the git
          # credential is not needed after checkout (publishing goes through
          # the API with the step-scoped token below).
          persist-credentials: false
          fetch-depth: 0

      - name: Install hermetic (pinned, verified)
        uses: ./.github/actions/setup-hermetic

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck disable=SC1010 # `do` is just's shared-task namespace, not the shell keyword.
          just do release --ci

      # Build provenance for what goreleaser published: every archive, every
      # SBOM and checksums.txt a subject (the cosign bundle beside them is a
      # signature, not a subject), so nothing fetched goes unattested: verifiable with
      # `gh attestation verify <asset> --repo <owner>/<repo>` wherever gh is,
      # no cosign needed, which is how a bootstrap verifies the binary it
      # fetches before any tool exists. The cosign bundle over checksums.txt
      # stays the signature. The paths are goreleaser's dist (.release-go.yaml;
      # limen's model is .build/release) and its archive format. GitHub serves
      # attestations for public repositories on every plan and for private
      # ones on Enterprise Cloud only, so a private repository skips this and
      # keeps the bundle.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            .build/release/*.tar.gz
            .build/release/*.sbom.json
            .build/release/checksums.txt
