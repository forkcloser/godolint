# This project's carve-outs from the Go lint baseline (.limen/lint-go.yaml):
# the baseline's sections, in its shape, holding only what this project adds,
# changes or takes out (book/per-language.md, "one baseline, per-project
# carve-outs"). `just do lint go` renders the two on every run.
golangci:
  linters:
    exclusions:
      rules:
        # Tests are black-box consumers: beyond what the baseline already
        # exempts them from, the rule corpus is one table per rule,
        # deliberately alike.
        - path: _test\.go
          linters:
            - dupl # a rule's test table looks like every other rule's
            - dupword # Dockerfile fixtures repeat words
        # A ported case keeps the name hadolint's spec gives it, as written
        # there.
        - path: ^internal/rules/dl\d+_test\.go$
          linters:
            - misspell
        # hack/ holds the generators that ported hadolint's rules and tests.
        # They are dev-only programs, run by hand and never shipped: printing
        # to stdout is their interface, and the hadolint corpus they parse
        # dictates their shape.
        - path: ^hack/
          linters:
            - forbidigo # a generator reports on stdout
            - gocognit
            - goconst
        # examples/ are runnable programs for a reader, printing what they
        # demonstrate.
        - path: ^examples/
          linters:
            - forbidigo
    settings:
      depguard:
        rules:
          main:
            # The five dependencies this linter is built on: the Dockerfile
            # parser it shares with buildkit, the shell parser it hands RUN
            # commands to, the CLI framework, the house application toolkit,
            # and the YAML parser hadolint's configuration file is read
            # with. Everything else stays the baseline's $gostd.
            allow:
              - github.com/moby/buildkit
              - mvdan.cc/sh/v3/syntax
              - github.com/alecthomas/kong
              - github.com/mycophonic/primordium
              - go.yaml.in/yaml/v4
              # The files the linter, the command and the generators open go
              # through xos: os, call for call, and on Windows a file that
              # can be renamed or removed while it is open.
              - github.com/forkcloser/go-xos
              # Not a dependency. depguard checks one entry per import, the last
              # that sorts at or before it: with go.yaml.in/… allowed, that
              # entry is the one it finds for the standard library's go/…
              # packages, and it refuses them (go/format, in hack/gen-tests).
              # This entry sorts after it.
              - go/
